<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Airfryer 500 — App de Receitas</title>

<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airfryer 500">

<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --laranja: #ff6b35;
    --laranja-escuro: #d9481a;
    --vermelho: #e63946;
    --creme: #fff8f0;
    --marrom: #3a2318;
    --texto-claro: #7a6558;
    --border: #f0dfd0;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #ddd; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--marrom);
    overscroll-behavior-y: contain;
  }
  h1,h2,h3,.brand { font-family: 'Space Grotesk', sans-serif; }

  #phone {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--creme);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(135deg, var(--laranja), var(--vermelho));
    color: #fff;
    padding: calc(16px + var(--safe-top)) 18px 16px;
  }
  header.topbar .brand { font-size: 20px; font-weight: 700; }
  header.topbar .sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
  .back-row { display: flex; align-items: center; gap: 10px; }
  .back-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    width: 34px; height: 34px;
    border-radius: 10px;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .heart-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    border: none;
    width: 36px; height: 36px;
    border-radius: 10px;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .heart-btn.active { background: #fff; color: var(--vermelho); }

  .search-wrap { padding: 12px 18px 0; }
  .search-box {
    background: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
  }
  .search-box input {
    border: none; outline: none; flex: 1; font-size: 14px; font-family: 'Inter', sans-serif;
    background: transparent; color: var(--marrom);
  }

  main {
    flex: 1;
    padding: 16px 18px calc(90px + var(--safe-bottom));
    overflow-y: auto;
  }

  .destaque {
    background: linear-gradient(135deg, #3a2318, #57331f);
    color: #fff;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  .destaque .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.75; }
  .destaque h3 { font-size: 18px; margin: 6px 0 8px; }
  .destaque .meta { font-size: 12px; opacity: 0.85; }

  h2.section-title { font-size: 15px; margin: 4px 0 12px; color: var(--laranja-escuro); }

  .cats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .cat-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .cat-card:active { transform: scale(0.97); }
  .cat-card .emoji { font-size: 26px; }
  .cat-card .nome { font-weight: 600; font-size: 13.5px; margin-top: 6px; line-height: 1.25; }
  .cat-card .count { font-size: 11px; color: var(--texto-claro); margin-top: 2px; }

  .receita-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .receita-item:active { transform: scale(0.98); }
  .receita-item .ico { font-size: 20px; }
  .receita-item .info { flex: 1; min-width: 0; }
  .receita-item .info .nome { font-weight: 600; font-size: 13.5px; }
  .receita-item .info .meta { font-size: 11.5px; color: var(--texto-claro); margin-top: 2px; }
  .receita-item .chev { color: var(--texto-claro); font-size: 16px; }

  .empty-state {
    text-align: center;
    color: var(--texto-claro);
    font-size: 13.5px;
    padding: 40px 20px;
  }

  /* DETALHE DA RECEITA */
  .badges { display: flex; gap: 8px; margin: 6px 0 4px; }
  .badge {
    font-size: 11px;
    background: rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .card-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-block h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--texto-claro);
    margin-bottom: 10px;
  }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    cursor: pointer;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item .box {
    width: 20px; height: 20px; min-width: 20px;
    border-radius: 6px;
    border: 2px solid var(--laranja);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: #fff;
    margin-top: 1px;
  }
  .check-item.done .box { background: var(--laranja); }
  .check-item.done span.txt { text-decoration: line-through; color: var(--texto-claro); }
  .step-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .step-item:last-child { border-bottom: none; }
  .step-num {
    min-width: 24px; height: 24px;
    background: var(--laranja);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 700;
  }

  /* BOTTOM NAV */
  nav.bottomnav {
    position: sticky;
    bottom: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 10px calc(10px + var(--safe-bottom));
    z-index: 10;
  }
  nav.bottomnav .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--texto-claro);
    font-size: 10.5px;
    font-family: 'Inter', sans-serif;
    padding: 6px 0;
    cursor: pointer;
  }
  nav.bottomnav .tab .ic { font-size: 19px; }
  nav.bottomnav .tab.active { color: var(--laranja-escuro); font-weight: 700; }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>

const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const byId = id => DATA.receitas.find(r => r.id === Number(id));
const byCat = slug => DATA.receitas.filter(r => r.cat === slug);

function getFavs() { try { return JSON.parse(localStorage.getItem('af_favs') || '[]'); } catch(e) { return []; } }
function setFavs(f) { localStorage.setItem('af_favs', JSON.stringify(f)); }
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
  let f = getFavs();
  f = f.includes(id) ? f.filter(x => x !== id) : [...f, id];
  setFavs(f);
}

function receitaDoDia() {
  const dayKey = new Date().toDateString();
  let h = 0;
  for (let i=0;i<dayKey.length;i++) h = (h*31 + dayKey.charCodeAt(i)) % 500;
  return DATA.receitas[h];
}

function catInfo(slug) { return DATA.categorias.find(c => c.slug === slug); }

function setTopbar(html) { document.getElementById('topbar').innerHTML = html; }
function setMain(html) { document.getElementById('main').innerHTML = html; document.getElementById('main').scrollTop = 0; }

function renderHome() {
  setTopbar(`
    <div class="brand">🍳 Airfryer 500</div>
    <div class="sub">+500 receitas na ponta do dedo</div>
    <div class="search-wrap" style="padding-left:0;padding-right:0;padding-top:12px;">
      <div class="search-box">
        <span>🔍</span>
        <input id="home-search" placeholder="Buscar receita (ex: frango, bolo, batata...)" oninput="onHomeSearch(this.value)">
      </div>
    </div>
  `);
  const dia = receitaDoDia();
  const cats = DATA.categorias.map(c => `
    <div class="cat-card" onclick="location.hash='#/cat/${c.slug}'">
      <div class="emoji">${c.emoji}</div>
      <div class="nome">${c.nome}</div>
      <div class="count">${c.count} receitas</div>
    </div>`).join('');
  setMain(`
    <div class="destaque" onclick="location.hash='#/r/${dia.id}'">
      <div class="tag">⭐ Receita do dia</div>
      <h3>${dia.nome}</h3>
      <div class="meta">⏱ ${dia.tempo} · 🌡 ${dia.temp}</div>
    </div>
    <h2 class="section-title">Categorias</h2>
    <div class="cats-grid">${cats}</div>
    <div id="home-results"></div>
  `);
}

function onHomeSearch(q) {
  const el = document.getElementById('home-results');
  if (!q || q.trim().length < 2) { el.innerHTML = ''; return; }
  const nq = norm(q);
  const res = DATA.receitas.filter(r => norm(r.nome).includes(nq)).slice(0, 30);
  el.innerHTML = renderList(res, true);
}

function renderList(list, compact) {
  if (list.length === 0) return `<div class="empty-state">Nenhuma receita encontrada.</div>`;
  return list.map(r => `
    <div class="receita-item" onclick="location.hash='#/r/${r.id}'">
      <div class="ico">${catInfo(r.cat).emoji}</div>
      <div class="info">
        <div class="nome">${r.nome}</div>
        <div class="meta">⏱ ${r.tempo} · 🌡 ${r.temp}</div>
      </div>
      <div class="chev">›</div>
    </div>`).join('');
}

function renderCategoria(slug) {
  const cat = catInfo(slug);
  if (!cat) { location.hash = '#/'; return; }
  setTopbar(`
    <div class="back-row">
      <button class="back-btn" onclick="location.hash='#/'">←</button>
      <div>
        <div class="brand">${cat.emoji} ${cat.nome}</div>
        <div class="sub">${cat.count} receitas</div>
      </div>
    </div>
  `);
  const list = byCat(slug);
  setMain(renderList(list));
}

function renderBusca(prefill) {
  setTopbar(`
    <div class="brand">🔍 Buscar receitas</div>
    <div class="search-wrap" style="padding-left:0;padding-right:0;padding-top:12px;">
      <div class="search-box">
        <span>🔍</span>
        <input id="busca-input" placeholder="Digite o nome da receita..." oninput="onBuscaInput(this.value)" value="${prefill || ''}">
      </div>
    </div>
  `);
  setMain(`<div id="busca-results">${prefill ? renderList(searchList(prefill)) : '<div class="empty-state">Digite algo pra buscar entre as 500 receitas.</div>'}</div>`);
  setTimeout(() => { const i = document.getElementById('busca-input'); if (i) i.focus(); }, 50);
}
function searchList(q) {
  const nq = norm(q);
  return DATA.receitas.filter(r => norm(r.nome).includes(nq));
}
function onBuscaInput(q) {
  document.getElementById('busca-results').innerHTML = q.trim().length >= 1 ? renderList(searchList(q)) : '<div class="empty-state">Digite algo pra buscar entre as 500 receitas.</div>';
}

function renderFavoritos() {
  setTopbar(`<div class="brand">❤️ Favoritos</div><div class="sub">Suas receitas salvas</div>`);
  const favs = getFavs();
  const list = DATA.receitas.filter(r => favs.includes(r.id));
  setMain(list.length ? renderList(list) : `<div class="empty-state">Você ainda não favoritou nenhuma receita.<br>Toque no ❤️ dentro de uma receita pra salvar aqui.</div>`);
}

function renderReceita(id) {
  const r = byId(id);
  if (!r) { location.hash = '#/'; return; }
  const fav = isFav(r.id);
  setTopbar(`
    <div class="back-row">
      <button class="back-btn" onclick="history.length>1?history.back():location.hash='#/cat/${r.cat}'">←</button>
      <div>
        <div class="brand" style="font-size:16px;">${catInfo(r.cat).emoji} ${catInfo(r.cat).nome}</div>
      </div>
      <button class="heart-btn ${fav?'active':''}" onclick="onToggleFav(${r.id})">${fav?'❤️':'🤍'}</button>
    </div>
    <h1 style="font-size:19px;margin:10px 0 2px;">${r.nome}</h1>
    <div class="badges"><span class="badge">⏱ ${r.tempo}</span><span class="badge">🌡 ${r.temp}</span></div>
  `);
  const ingredientesHtml = r.ingredientes.map((ing, i) => `
    <div class="check-item" onclick="this.classList.toggle('done')">
      <div class="box">✓</div><span class="txt">${ing}</span>
    </div>`).join('');
  const passosHtml = r.passos.map((p, i) => `
    <div class="step-item"><div class="step-num">${i+1}</div><div>${p}</div></div>`).join('');
  setMain(`
    <div class="card-block"><h4>Ingredientes</h4>${ingredientesHtml}</div>
    <div class="card-block"><h4>Modo de preparo</h4>${passosHtml}</div>
  `);
}
function onToggleFav(id) { toggleFav(id); renderReceita(id); }

function updateNav() {
  const h = location.hash || '#/';
  document.querySelectorAll('.bottomnav .tab').forEach(btn => {
    const r = btn.dataset.route;
    const on = (r === '#/' && (h === '#/' || h === '' || h.startsWith('#/cat/') || h.startsWith('#/r/'))) || (r !== '#/' && h.startsWith(r));
    btn.classList.toggle('active', on);
  });
}

function router() {
  const h = location.hash || '#/';
  if (h === '#/' || h === '') renderHome();
  else if (h.startsWith('#/cat/')) renderCategoria(h.replace('#/cat/',''));
  else if (h.startsWith('#/r/')) renderReceita(h.replace('#/r/',''));
  else if (h === '#/busca') renderBusca('');
  else if (h === '#/favoritos') renderFavoritos();
  else renderHome();
  updateNav();
}

document.querySelectorAll('.bottomnav .tab').forEach(btn => {
  btn.addEventListener('click', () => { location.hash = btn.dataset.route; });
});

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
router();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
